<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Privacy Image Guard</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="toolbar" aria-label="작업 도구">
        <div class="brand">
          <span class="mark"></span>
          <div>
            <h1>Privacy Image Guard</h1>
            <p>공유 전 사진 속 개인정보 단서를 확인하세요.</p>
          </div>
        </div>

        <div class="actions">
          <label class="file-button">
            이미지 업로드
            <input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp" />
          </label>
          <button id="sampleBtn" type="button">샘플 불러오기</button>
          <button id="detectBtn" type="button">AI 분석</button>
          <button id="applyBtn" type="button" class="primary">선택 가리기</button>
          <button id="verifyBtn" type="button">선택 확인</button>
          <button id="downloadBtn" type="button">다운로드</button>
        </div>
      </section>

      <section class="workspace">
        <aside class="side-panel">
          <div class="field">
            <label for="agentMode">실행 모드</label>
            <select id="agentMode">
              <option value="auto">CV API 분석</option>
              <option value="local">로컬 데모</option>
            </select>
          </div>

          <div class="field">
            <label for="replacementType">수동 영역 유형</label>
            <select id="replacementType">
              <option value="face">얼굴</option>
              <option value="store_sign">간판</option>
              <option value="road_sign">도로 표지판</option>
              <option value="license_plate">차량 번호판</option>
              <option value="landmark">위치 단서</option>
            </select>
          </div>

          <div class="field">
            <label for="intensity">가리기 강도</label>
            <input id="intensity" type="range" min="1" max="3" value="2" />
          </div>

          <div class="switch-row">
            <button id="selectAllBtn" type="button">전체 선택</button>
            <button id="preserveModeBtn" type="button">유지 클릭</button>
            <button id="clearBtn" type="button">초기화</button>
          </div>

          <div class="candidate-head">
            <h2>치환 후보</h2>
            <span id="candidateCount">0</span>
          </div>
          <ol id="candidateList" class="candidate-list"></ol>

          <div class="agent-head">
            <h2>분석 결과</h2>
            <span id="agentBadge">standby</span>
          </div>
          <div id="agentPlan" class="agent-plan">
            이미지 업로드 후 AI 분석을 누르면 개인정보 단서 후보가 표시됩니다.
          </div>
        </aside>

        <section class="stage-wrap">
          <div class="stage-head">
            <div class="tabs" role="tablist" aria-label="보기 모드">
              <button id="resultTab" type="button" class="active">결과</button>
              <button id="originalTab" type="button">원본</button>
            </div>
            <p id="statusText">샘플 이미지가 준비되었습니다.</p>
          </div>

          <div class="canvas-frame">
            <canvas id="imageCanvas" width="1200" height="760"></canvas>
          </div>
        </section>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
