server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 ipv6=off;

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
    }

    location /docs {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
    }

    location = /openapi.json {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
